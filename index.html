          const sizeChange = compareShoulders ? Math.abs(Math.log(width / trackedVisitor.width)) : 0;
          if (distance > Math.max(.09, trackedVisitor.width * .7) || sizeChange > .45) continue;
          score = distance + sizeChange * .15;
        }

        if (score < bestScore) {
          bestScore = score;
          selected = { landmarks, shoulders, face, width };
        }
      }

      if (selected) trackedVisitor = selected;
      return selected?.landmarks;
    }

    function handleFlightKey(event) {
      if (event.altKey || event.ctrlKey || event.metaKey ||
          event.target.closest?.('input, select, textarea, [contenteditable]')) return;

      if (event.code === 'KeyR') {
        event.preventDefault();
        if (!event.repeat) resetExperience(performance.now());
        return;
      }
      if (event.code !== 'Space' || event.target.closest?.('button')) return;

      event.preventDefault();
      if (event.repeat || flightHeight === 100 || returnReason === 'complete') return;
      if (!experienceStarted && countdownEndsAt !== null) return;
      if (audioContext?.state !== 'running') enableSound();

      keyboardFlight = true;
      if (returnReason === 'away') clearReturn();

      const now = performance.now();
      if (experienceStarted) {
        if (updraftReadyAt !== null && !updraftClosed) {
          detectBoost({ armsSpread: true }, now);
          return;
        }
        if (windChallenge?.clearedAt === null) {
          windChallenge.keyboardBalance = true;
          return;
        }
        keyboardFlapAt = now;
        addLift(keyboardLift, now);
      } else if (countdownEndsAt === null) {
        startCountdown(now);
      }
    }

    async function loadPoseLandmarker() {
      const { FilesetResolver, PoseLandmarker } = await import(`${mediaPipeUrl}/vision_bundle.mjs`);
      const vision = await FilesetResolver.forVisionTasks(`${mediaPipeUrl}/wasm`);
      return PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'
        },
        runningMode: 'VIDEO',
        numPoses: 3
      });
    }

    async function startPoseTracking(stream) {
      cameraMessage.hidden = false;
      retry.hidden = true;
      status.textContent = experienceStarted ? '동작 인식 준비 중' : '';
      if (!experienceStarted) setPoseStatus('동작 인식 준비 중');
      cameraMessage.hidden = !experienceStarted;
      let poseLandmarker;
      let timeout;

      function showPoseError(error) {
        console.error('동작 인식 오류', error);
        poseFrame = undefined;
        poseLandmarkerPromise = undefined;
        poseLandmarker?.close();
        emptyCameraSince = null;
        if (returnReason === 'away') clearReturn();
        updateTrackedPose(null, performance.now());
        resetVisitorGuide();
        const message = '동작 인식 재시도';
        status.textContent = experienceStarted ? message : '';
        if (!experienceStarted) setPoseStatus(message);
        cameraMessage.hidden = false;
        retry.hidden = false;
      }

      try {
        let expired = false;
        const loading = poseLandmarkerPromise ??= loadPoseLandmarker().then(model => {
          if (expired) model.close();
          return model;
        });
        const deadline = new Promise((_, reject) => {
          timeout = setTimeout(() => {
            expired = true;
            if (poseLandmarkerPromise === loading) poseLandmarkerPromise = undefined;
            reject(new Error('동작 인식 준비 시간 초과'));
          }, 20000);
        });
        poseLandmarker = await Promise.race([loading, deadline]);

        if (video.srcObject !== stream) return;
        cameraMessage.hidden = true;
        if (countdownEndsAt === null) setPoseStatus('');
        let lastDetection = -Infinity;

        function trackPose(now) {
          if (video.srcObject !== stream) return;

          if (now - lastDetection >= (flightHeight === 100 ? 240 : 65)) {
            const frameGap = now - lastDetection;
            if (frameGap > 450) raisedStroke = null;
            lastDetection = now;
            try {
              const { landmarks } = poseLandmarker.detectForVideo(video, now);
              const cameraHasPerson = updateCameraPresence(landmarks, now);
              updateTrackedPose(selectVisitor(landmarks, now), now, cameraHasPerson);
              if (!experienceStarted && scene.classList.contains('is-tracking')) {
                renderFlightWings(now, Math.min(.1, frameGap / 1000));
              }
            } catch (error) {
              showPoseError(error);
              return;
            }
          }

          poseFrame = video.requestVideoFrameCallback(trackPose);
        }

        poseFrame = video.requestVideoFrameCallback(trackPose);
      } catch (error) {
        if (video.srcObject === stream) showPoseError(error);
      } finally {
        clearTimeout(timeout);
      }
    }

    function showCameraMessage(message, canRetry) {
      camera.classList.remove('is-live');
      cameraMessage.hidden = false;
      status.textContent = message;
      retry.hidden = !canRetry;
    }

    async function startCamera() {
      showCameraMessage('카메라 연결 중', false);

      if (!navigator.mediaDevices?.getUserMedia) {
        showCameraMessage('크롬에서 열어 주세요.', false);
        return;
      }

      let stream;
      let timeout;
      let expired = false;
      const deadline = new Promise((_, reject) => {
        timeout = setTimeout(() => {
          expired = true;
          reject(new DOMException('카메라 연결 시간 초과', 'TimeoutError'));
        }, 10000);
      });

      try {
        const openPreview = async () => {
          const requestedStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          if (expired) {
            requestedStream.getTracks().forEach(track => track.stop());
            return;
          }
          stream = requestedStream;
          video.srcObject = stream;
          await video.play();
        };

        await Promise.race([openPreview(), deadline]);
        const track = stream.getVideoTracks()[0];
        if (track?.readyState !== 'live') throw new DOMException('카메라 연결 끊김', 'NotReadableError');
        camera.classList.add('is-live');
        cameraMessage.hidden = true;

        track.addEventListener('ended', () => {
          if (poseFrame !== undefined) video.cancelVideoFrameCallback(poseFrame);
          else poseLandmarkerPromise = undefined;
          poseFrame = undefined;
          video.srcObject = null;
          emptyCameraSince = null;
          if (returnReason === 'away') clearReturn();
          updateTrackedPose(null, performance.now());
          resetVisitorGuide();
          showCameraMessage('카메라 연결 끊김', true);
        }, { once: true });
        startPoseTracking(stream);
      } catch (error) {
        stream?.getTracks().forEach(track => track.stop());
        if (video.srcObject === stream) video.srcObject = null;

        let message = '카메라 연결 확인';
        if (error.name === 'NotAllowedError') {
          message = '카메라를 허용해 주세요.';
        } else if (error.name === 'NotFoundError') {
          message = '카메라가 없어요.';
        } else if (error.name === 'NotReadableError' || error.name === 'AbortError') {
          message = '다른 카메라 앱을 닫아요.';
        } else if (error.name === 'TimeoutError') {
          message = '카메라 권한을 확인해요.';
        }
        showCameraMessage(message, true);
      } finally {
        clearTimeout(timeout);
      }
    }

    retry.addEventListener('click', () => {
      if (video.srcObject && camera.classList.contains('is-live')) {
        startPoseTracking(video.srcObject);
      } else {
        startCamera();
      }
    });
    scene.addEventListener('click', enableSound);
    document.addEventListener('keydown', handleFlightKey);
    setInterval(monitorVisitor, 100);
    startCamera();
  </script>
</body>
</html>
